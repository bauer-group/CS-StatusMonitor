# =============================================================================
# Dependabot Configuration
# =============================================================================
# Watches:
#   1. GitHub Actions versions (workflows pinned to @main pull module updates)
#   2. Image references inside docker-compose*.yml files
#   3. Base image in src/status-monitor/Dockerfile
#
# Pure digest drift on the existing tag is handled by check-base-images.yml
# (daily cron); this surfaces tag bumps and version updates as PRs.
#
# Commit prefixes decide whether a merged update is released
# (docker-maintenance.yml dispatches docker-release.yml after the merge):
#   docker, docker-compose -> fix(docker): PATCH release, the image is rebuilt
#                             (the base image and the compose files operators
#                             deploy, Coolify included, ship to users)
#   github-actions         -> chore(ci): no release, never auto-merged
# =============================================================================

version: 2
updates:
  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "sunday"
      time: "13:45"
      timezone: "Etc/UTC"
    labels:
      - "dependencies"
      - "github-actions"
      - "dependabot"
    commit-message:
      prefix: "chore(ci)"

  # Docker Compose images
  - package-ecosystem: "docker-compose"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "sunday"
      time: "13:45"
      timezone: "Etc/UTC"
    labels:
      - "dependencies"
      - "docker"
      - "dependabot"
    commit-message:
      prefix: "fix(docker)"

  # uptime-kuma base image (louislam/uptime-kuma in src/status-monitor/Dockerfile)
  - package-ecosystem: "docker"
    directory: "/src/status-monitor"
    schedule:
      interval: "weekly"
      day: "sunday"
      time: "13:45"
      timezone: "Etc/UTC"
    labels:
      - "dependencies"
      - "docker"
      - "dependabot"
    commit-message:
      prefix: "fix(docker)"
