# =============================================================================
# Docker Maintenance — Auto-merge Dependabot PRs
# =============================================================================
# No paths filter: every Dependabot PR reaches this workflow, whatever its
# ecosystem, and gets an explicit decision (annotation + job summary) instead
# of silently staying open:
#   - src/status-monitor/Dockerfile (docker): merged once the pull_request
#     run of docker-release.yml, which builds the image, has passed
#   - GitHub Actions updates and any change under .github/: left open by the
#     module's own guard - merge by hand
#   - a change docker-release.yml does not run for: left open, not tested
# Patch and minor updates are merged once the required PR CI passed; majors
# stay manual (module default merge-update-types).
#
# docker-release.yml only validates docker-compose*.yml (compose config), it
# starts no stack. Dependabot finds nothing to update there today (every image
# is ${VAR:-...}:${VERSION:-latest}); a literal versioned image added to a
# compose file would be merged after that validation alone.
#
# Release: a merge made with the GITHUB_TOKEN starts no push workflow, so
# after the merge this workflow dispatches docker-release.yml on main and
# waits for it (release-workflow). That run builds the merged commit again
# and only then:
# 1. Creates a semantic release (fix(docker) -> PATCH)
# 2. Builds and pushes the new status-monitor image
# A release run that does not succeed turns this job red. New uptime-kuma
# 2.x digests on the existing tag are still released by
# check-base-images.yml.
# =============================================================================

name: 🔧 Docker Maintenance

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: write       # merge
  pull-requests: write  # approve, read the PR
  checks: read          # check runs and suites of the PR head commit
  statuses: read        # commit statuses of the PR head commit
  actions: write        # dispatch the release; read workflow runs

jobs:
  maintenance:
    name: Auto-merge Dependabot PRs
    uses: bauer-group/automation-templates/.github/workflows/docker-maintenance-dependabot.yml@main
    with:
      merge-method: 'squash'
      auto-approve: true
      # Merge only after this PR CI has passed on the PR head commit - it
      # builds the image.
      required-workflows: '.github/workflows/docker-release.yml'
      # After a merge - and only then - dispatch the release on main and
      # wait for it: it rebuilds the merged commit before it releases it,
      # and a failed release run fails this job.
      release-workflow: '.github/workflows/docker-release.yml'
    secrets: inherit
