# =============================================================================
# Docker Maintenance — Auto-merge Dependabot PRs
# =============================================================================
# No paths filter: every Dependabot PR reaches this workflow, whatever its
# ecosystem, and gets an explicit decision (annotation + job summary) instead
# of silently staying open:
#   - src/status-monitor/Dockerfile (docker): merged once the pull_request
#     run of docker-release.yml, which builds the image, has passed
#   - GitHub Actions updates and any change under .github/: left open by the
#     module's own guard - merge by hand
#   - a change docker-release.yml does not run for: left open, not tested
# Only patch updates are merged (module default merge-update-types).
#
# docker-release.yml only validates docker-compose*.yml (compose config), it
# starts no stack. Dependabot finds nothing to update there today (every image
# is ${VAR:-...}:${VERSION:-latest}); a literal versioned image added to a
# compose file would be merged after that validation alone.
#
# No release from a merge: Dependabot commits as chore(...), and a merge made
# with GITHUB_TOKEN starts no push workflow. New uptime-kuma 2.x digests are
# released by check-base-images.yml.
# =============================================================================

name: 🔧 Docker Maintenance

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: write
  pull-requests: write

jobs:
  maintenance:
    name: Auto-merge Dependabot PRs
    uses: bauer-group/automation-templates/.github/workflows/docker-maintenance-dependabot.yml@main
    with:
      merge-method: 'squash'
      auto-approve: true
      # Merge only after this PR CI has passed on the PR head commit - it
      # builds the image.
      required-workflows: '.github/workflows/docker-release.yml'
    secrets: inherit
